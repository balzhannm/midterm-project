<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodie — Reservation</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="foodie.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">Food<span>ie</span></div>
    <nav class="main-nav">
      <ul>
        <li><a href="foodie-home.html">Home</a></li>
        <li><a href="foodie-menu.html">Menu</a></li>
        <li><a href="foodie-about.html">About</a></li>
        <li><a href="foodie-reservation.html" class="active">Reservation</a></li>
        <li><a href="foodie-contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="section">
    <h2>Book a Table</h2>
    <p class="subtitle">Fill out the form and we'll confirm your reservation within an hour</p>

    <form class="contact-form" id="reservation-form">
      <label for="res-name">Name</label>
      <input type="text" id="res-name" name="res-name" placeholder="Your name" required>

      <label for="res-date">Date</label>
      <input type="date" id="res-date" name="res-date" required>

      <label for="res-time">Time</label>
      <input type="time" id="res-time" name="res-time" required>

      <label for="res-guests">Number of guests</label>
      <select id="res-guests" name="res-guests">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5+</option>
      </select>

      <label for="res-comments">Special requests</label>
      <textarea id="res-comments" name="res-comments" rows="3" placeholder="E.g. table by the window"></textarea>

      <button type="submit" class="btn">Book Now</button>
    </form>
  </section>

  <footer class="site-footer">
    <p>&copy; 2026 Foodie Restaurant. Student project — Midterm Assignment.</p>
  </footer>

</body>
</html>
