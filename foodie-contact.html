<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodie — Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="foodie.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">Food<span>ie</span></div>
    <nav class="main-nav">
      <ul>
        <li><a href="foodie-home.html">Home</a></li>
        <li><a href="foodie-menu.html">Menu</a></li>
        <li><a href="foodie-about.html">About</a></li>
        <li><a href="foodie-reservation.html">Reservation</a></li>
        <li><a href="foodie-contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="section">
    <h2>Get in Touch</h2>
    <p class="subtitle">We're always happy to answer your questions</p>

    <div class="card-grid" style="margin-bottom:40px;">
      <div class="card">
        <div class="card-body">
          <h3>Address</h3>
          <p>15 Kabanbay Batyr St, Astana</p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <h3>Phone</h3>
          <p>+7 (700) 123-45-67</p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <h3>Opening Hours</h3>
          <p>Daily, 10:00 AM – 11:00 PM</p>
        </div>
      </div>
    </div>

    <form class="contact-form">
      <label for="c-name">Name</label>
      <input type="text" id="c-name" name="c-name" placeholder="Your name" required>

      <label for="c-email">Email</label>
      <input type="email" id="c-email" name="c-email" placeholder="you@example.com" required>

      <label for="c-message">Message</label>
      <textarea id="c-message" name="c-message" rows="4" placeholder="Your message..."></textarea>

      <button type="submit" class="btn">Send</button>
    </form>
  </section>

  <footer class="site-footer">
    <p>&copy; 2026 Foodie Restaurant. Student project — Midterm Assignment.</p>
  </footer>

</body>
</html>
